[pytest]
# 测试文件匹配规则：所有测试位于 tests/ops/ 下，统一以 test_*.py 命名
python_files = test_*.py

# JUnit XML 报告格式（--junitxml 时生效），xunit1 兼容旧版 CI 解析
junit_family = xunit1

# 默认测试路径：benchmark 自测 + 算子库本体 + tests/ops（与 upstream 一致）
testpaths = tests/ops

# 测试公共层路径：所有算子的测试可直接 import tests/common 下的模块（pytest>=7）
pythonpath = tests/common

markers =
    soc: Mark test cases for specific SOC versions (e.g., 950, 910)
    jit_only: Mark test suites that only run in jit mode (excluded from aclnn stest)
    world_size: number of NPU cards required (e.g., 1, 2)

# 排除 experimental 目录（与 pypto 源仓保持一致，需显式指定才运行实验性算子）
norecursedirs = experimental/distributed